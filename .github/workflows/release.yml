# Keeps CHANGELOG.md and the release tags in step with main. On every push to main,
# release-please opens or updates a release PR that bumps the version and adds the merged
# changes to CHANGELOG.md, read from their Conventional Commit messages. Merging that PR tags
# the release (vX.Y.Z) and publishes its GitHub release, which Dependabot then offers projects.
#
# It acts as a GitHub App rather than GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger
# workflows, so the release PR could never pass its required checks. See README "Releasing".
name: Release

on:
  push:
    branches: [main]

permissions: {}

# Queue rather than cancel, so a run is never stopped between tagging and publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    # The App's private key is a secret of this environment, which only main can deploy to, so
    # a workflow pushed on any other branch can't read it.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
