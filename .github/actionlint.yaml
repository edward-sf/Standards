# actionlint 1.7.12 predates the job.workflow_* context properties, which GitHub documents at
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context.
# Remove this once actionlint knows them.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined'
