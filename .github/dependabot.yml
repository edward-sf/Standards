# Keeps the tools the shared workflows run current. Each update is a reviewed PR here, and
# reaches projects only when it's released.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /commitlint
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      commitlint:
        patterns: ["@commitlint/*"]

  # semgrep/requirements.txt: the one Semgrep version CI runs, via semgrep/semgrep.sh.
  - package-ecosystem: pip
    directory: /semgrep
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: uv
    directory: /tests/fixtures/python-app
    schedule:
      interval: monthly
    commit-message:
      prefix: test
    groups:
      fixture:
        patterns: ["*"]
